app = "grafoprint-production-api"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 120

[build]
  dockerfile = "../Dockerfile"
  build-target = "backend"

[env]
  # No desactiva el planificador general en NODE_ENV=production.
  # Inbox permanece cerrado por sus banderas explícitas.
  GRAFO_LOCAL_DISABLE_CRON = "true"
  API_LIMITES_PREFIJO = "grafo:production:limites:v1"
  META_WHATSAPP_PILOT_ENABLED = "false"
  META_WHATSAPP_RECEPCION_PILOT_ENABLED = "false"
  META_INBOX_PRUEBA_ENABLED = "false"
  META_INBOX_ENVIOS_ENABLED = "false"
  META_INBOX_ADJUNTOS_ENABLED = "false"
  META_INBOX_PLANTILLAS_ENABLED = "false"
  GRAFO_DEPLOY_ENV = "production"
  PORT = "3001"
  HOST = "::"
  FRONTEND_URL = "https://app.grafoprint.com.ar"
  REGISTRO_PUBLICO_URL = "https://app.grafoprint.com.ar"
  API_PUBLIC_URL = "https://api.grafoprint.com.ar"
  REGISTRO_PUBLICO_HABILITADO = "false"
  PADDLE_ENV = "production"
  AFIPSDK_ENVIRONMENT = "prod"
  PDF_RENDER_URL = "http://grafoprint-production-pdf.internal:3000"
  PRESUPUESTO_PDF_ASYNC = "false"
  PRESUPUESTO_PDF_PILOTO = "false"
  GRAFONEST_POOL_ID = "production"
  GRAFONEST_POOL_CPU = "2"
  GRAFONEST_POOL_MEMORY_MB = "3072"
  GRAFONEST_NORMAL_MAX_ACTIVE = "1"

[http_service]
  internal_port = 3001
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "60s"
    method = "GET"
    path = "/api"

[[vm]]
  cpu_kind = "performance"
  cpus = 1
  memory = "2gb"
