app = "grafoprint-staging-pdf"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 60

[build]
  image = "gotenberg/gotenberg@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769"

[env]
  API_BIND_IP = "0.0.0.0"
  TINI_SUBREAPER = "1"
  CHROMIUM_AUTO_START = "true"
  CHROMIUM_MAX_CONCURRENCY = "1"
  CHROMIUM_MAX_QUEUE_SIZE = "8"
  CHROMIUM_DISABLE_JAVASCRIPT = "true"
  CHROMIUM_DENY_PUBLIC_IPS = "true"
  CHROMIUM_DENY_PRIVATE_IPS = "true"
  API_BODY_LIMIT = "8MB"
  API_DISABLE_DOWNLOAD_FROM = "true"
  WEBHOOK_DISABLE = "true"
  LIBREOFFICE_DISABLE_ROUTES = "true"
  PDFENGINES_DISABLE_ROUTES = "true"

# Sólo red privada IPv6. No asignar servicio/puertos públicos.
[checks.pdf]
  type = "http"
  port = 3000
  method = "GET"
  path = "/health"
  interval = "30s"
  timeout = "5s"
  grace_period = "60s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
