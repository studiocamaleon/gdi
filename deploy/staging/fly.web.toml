# Staging activado con el presupuesto autorizado; una máquina.
app = "grafoprint-staging-web"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../Dockerfile"
  build-target = "web"

[env]
  STAGING_PRIVATE = "true"
  STAGING_WEB_ORIGIN = "https://staging.grafoprint.com.ar"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  API_URL = "http://grafoprint-staging-api.internal:3001/api"
  MARKETING_SITE_URL = "https://grafoprint.com.ar"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = false

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
