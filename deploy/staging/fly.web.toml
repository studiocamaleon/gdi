# Una máquina; el controlador coordina el reposo de los cinco servicios.
app = "grafoprint-staging-web"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "../Dockerfile"
  build-target = "web"

[env]
  STAGING_DEMANDA_ENABLED = "true"
  STAGING_DEMANDA_IDLE_SECONDS = "900"
  STAGING_PRIVATE = "true"
  STAGING_BASIC_AUTH_ENABLED = "false"
  STAGING_WEB_ORIGIN = "https://staging.grafoprint.com.ar"
  PORT = "3000"
  HOSTNAME = "0.0.0.0"
  API_URL = "http://grafoprint-staging-api.internal:3001/api"
  MARKETING_SITE_URL = "https://grafoprint.com.ar"

[http_service]
  processes = ["app"]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/api/health"

[[vm]]
  processes = ["app"]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"

[processes]
  app = "node /app/staging-demanda/servidor.mjs"

[[files]]
  guest_path = "/app/staging-demanda/control.mjs"
  local_path = "demanda/control.mjs"
[[files]]
  guest_path = "/app/staging-demanda/servidor.mjs"
  local_path = "demanda/servidor.mjs"

[[restart]]
  policy = "on-failure"
  processes = ["app"]
