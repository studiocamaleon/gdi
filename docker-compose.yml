services:
  pdf-renderer:
    profiles: ["pdf"]
    image: gotenberg/gotenberg@sha256:f29984bd1e226bf1b93ba90af06000afa8b315853e99d27b9aaa41b93f15c769
    container_name: gdi-saas-pdf-renderer
    restart: unless-stopped
    mem_limit: 1g
    cpus: 2
    ports:
      - "127.0.0.1:3002:3000"
    command:
      - "gotenberg"
      - "--chromium-auto-start"
      - "--chromium-max-concurrency=2"
      - "--chromium-max-queue-size=8"
      - "--chromium-disable-javascript"
      - "--chromium-deny-public-ips"
      - "--chromium-deny-private-ips"
      - "--api-body-limit=8MB"
      - "--api-disable-download-from"
      - "--webhook-disable"
      - "--libreoffice-disable-routes"
      - "--pdfengines-disable-routes"

  postgres:
    image: postgres:16-alpine
    container_name: gdi-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdi_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - gdi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gdi-saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gdi_redis_data:/data

volumes:
  gdi_postgres_data:
  gdi_redis_data:
