services:
  postgres:
    image: postgres:16-alpine
    container_name: gdi-saas-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gdi_saas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5436:5432"
    volumes:
      - gdi_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gdi-saas-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - gdi_redis_data:/data

volumes:
  gdi_postgres_data:
  gdi_redis_data:
