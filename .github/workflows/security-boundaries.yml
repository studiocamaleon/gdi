name: Comprobar permisos y separación de empresas

on:
  pull_request:
    branches: [main, 'codex/**']
    # Este control será obligatorio para main: no filtrar por paths, porque
    # GitHub dejaría el requisito pendiente en PR de documentación o frontend.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-boundaries-${{ github.ref }}
  cancel-in-progress: true

jobs:
  http:
    # Ejecutor efímero gratuito para este repositorio público; revisar
    # presupuesto antes de habilitarlo si se cambia su visibilidad.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      redis-colas:
        image: redis:7-alpine
        ports:
          - 16387:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: gdi_saas_test
        ports:
          - 5436:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d gdi_saas_test"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      # Son únicamente accesos desechables del contenedor de este job.
      DATABASE_URL: postgresql://postgres:postgres@localhost:5436/gdi_saas_test?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5436/gdi_saas_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5436/gdi_saas_test?schema=public
      GRAFO_LOCAL_DISABLE_CRON: 'true'
      TZ: UTC
      TEST_QUEUE_REDIS_URL: redis://127.0.0.1:16387
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - name: Preparar la dependencia local del motor
        working-directory: grafo-hotwire-linker-v1
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm test
      - name: Preparar API y base vacía de pruebas
        working-directory: apps/api
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run test:dependencias
          npm run prisma:generate
          npm run prisma:migrate:deploy
      - name: Comprobar permisos, referencias ajenas y enlaces públicos por HTTP
        working-directory: apps/api
        # Lista explícita: estas suites crean y retiran sus propios fixtures.
        # No requieren seed, cuentas reales ni acceso a proveedores externos.
        run: |
          node node_modules/jest/bin/jest.js --runInBand --runTestsByPath \
            src/auth/__tests__/revocacion-multi-instancia.integration.spec.ts \
            src/usuarios/__tests__/crear-usuario.spec.ts \
            src/usuarios/__tests__/password.spec.ts \
            src/motor-universal/__tests__/impresion-corte-area-compartida.spec.ts \
            src/motor-universal/__tests__/nesting-compuesto-shadow.spec.ts \
            src/auth/__tests__/modulos-aislamiento-http.integration.spec.ts \
            src/auth/__tests__/tesoreria-aislamiento-http.integration.spec.ts \
            src/administracion/__tests__/facturacion-permisos-http.integration.spec.ts \
            src/administracion/__tests__/permisos-comprobantes.spec.ts \
            src/auth/__tests__/permisos-vistas.spec.ts \
            src/auth/__tests__/transversales-recorridos.spec.ts \
            src/presupuestos/__tests__/aprobacion-permisos.spec.ts \
            src/empleados/__tests__/empleados-integridad.spec.ts \
            src/usuarios/__tests__/roles.spec.ts \
            src/administracion/__tests__/metodos-cajas.spec.ts \
            src/administracion/__tests__/cajas-consultas-compartidas.spec.ts \
            src/administracion/__tests__/anticipos-cuenta-corriente.spec.ts \
            src/administracion/__tests__/tesoreria-operativa.spec.ts \
            src/archivos/__tests__/cajas-recibos.spec.ts \
            src/productos-servicios/__tests__/producto-cotizacion-publico.spec.ts \
            src/ordenes-trabajo/__tests__/descuento-posterior.spec.ts \
            src/ordenes-trabajo/__tests__/descuento-posterior.integration.spec.ts \
            src/centro-copiado/__tests__/inicializacion-requisitos.spec.ts \
            src/administracion/__tests__/medios-pago-retenciones.integration.spec.ts \
            src/auth/__tests__/comercial-relaciones-http.integration.spec.ts \
            src/auth/__tests__/registros-compras-aislamiento-http.integration.spec.ts \
            src/auth/__tests__/egresos-aislamiento-http.integration.spec.ts \
            src/auth/__tests__/inventario-aislamiento-http.integration.spec.ts \
            src/auth/__tests__/costos-maquinaria-http.integration.spec.ts \
            src/centro-copiado/__tests__/permisos-http.integration.spec.ts \
            src/archivos/__tests__/permisos-http.integration.spec.ts \
            src/clientes/__tests__/solicitudes-alta.http.integration.spec.ts \
            src/enlaces-publicos/__tests__/enlaces-publicos.http.integration.spec.ts \
            src/produccion/__tests__/produccion-aislamiento-http.integration.spec.ts \
            src/productos-servicios/__tests__/productos-aislamiento-http.integration.spec.ts \
            src/eta/__tests__/eta-aislamiento-http.integration.spec.ts \
            src/cotizaciones/cotizaciones-aislamiento-http.integration.spec.ts \
            src/impresion/impresion-aislamiento-http.integration.spec.ts \
            src/integraciones/integraciones-aislamiento-http.integration.spec.ts \
            src/workers/admision-colas.integration.spec.ts \
            src/workers/contexto-calculos.integration.spec.ts \
            src/workers/geometria/geometria.worker.spec.ts \
            src/motor-universal/geometria-vectorial/cache-presupuesto.integration.spec.ts \
            src/motor-universal/geometria-vectorial/geometria-vectorial-cache.service.spec.ts \
            src/motor-universal/geometria-vectorial/analisis-vectorial-async.service.spec.ts \
            src/motor-universal/geometria-vectorial/dxf-seguro.spec.ts \
            src/mcp/__tests__/armar-jobcontext.spec.ts \
            src/panel-general/__tests__/panel-actividad-entradas.spec.ts \
            src/panel-general/__tests__/panel-admin.spec.ts \
            src/panel-general/__tests__/panel-general.spec.ts \
            src/panel-general/__tests__/entregas-estados.integration.spec.ts \
            src/gastos-fijos/__tests__/programacion.integration.spec.ts \
            src/integraciones/meta/meta-inbox.spec.ts \
            src/integraciones/meta/meta-inbox-general.integration.spec.ts \
            src/egresos/__tests__/egresos-entradas.spec.ts \
            src/archivos/storage/local-confinamiento.spec.ts \
            src/archivos/storage/local.driver.spec.ts \
            src/archivos/storage/subida-inmutable.spec.ts
      - name: Comprobar canal privado de producción y credenciales fiscales ficticias
        working-directory: apps/api
        run: |
          node node_modules/jest/bin/jest.js --runInBand --runTestsByPath \
            src/common/staging-ingress.spec.ts \
            src/common/production-ingress.spec.ts \
            src/fiscal-plataforma/certificado-arca.spec.ts \
            src/administracion/__tests__/afip-credenciales-seguridad.spec.ts \
            src/administracion/__tests__/afip-tickets.spec.ts
      - name: Crear base desechable exclusiva para la prueba ARCA de Plataforma
        working-directory: apps/api
        run: |
          node <<'NODE'
          const { PrismaClient } = require('@prisma/client');
          (async () => {
            const c = new PrismaClient();
            try { await c.$executeRawUnsafe('CREATE DATABASE grafo_arca_20261001_test'); }
            finally { await c.$disconnect(); }
          })().catch(() => process.exit(1));
          NODE
      - name: Comprobar autorización, cifrado y concurrencia de certificados ARCA
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5436/grafo_arca_20261001_test?schema=public
          MIGRATE_DATABASE_URL: postgresql://postgres:postgres@localhost:5436/grafo_arca_20261001_test?schema=public
          TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5436/grafo_arca_20261001_test?schema=public
        run: |
          npm run prisma:migrate:deploy
          node node_modules/jest/bin/jest.js --runInBand --runTestsByPath src/plataforma/__tests__/fiscal-arca.integration.spec.ts
