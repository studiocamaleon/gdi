name: Validar contenedores de staging

on:
  push:
    branches: [codex/staging-infraestructura]
    paths:
      - '.github/workflows/staging-validation.yml'
      - 'deploy/Dockerfile'
      - 'deploy/staging/compose.yaml'
      - 'deploy/staging/init-local-env.mjs'
      - 'deploy/staging/prepare-local-postgres.sql'
      - '.dockerignore'
      - 'apps/api/**'
      - 'grafo-hotwire-linker-v1/**'
      - 'src/**'
      - 'public/**'
      - 'package*.json'
      - 'next.config.ts'
      - 'tsconfig.json'
      - 'postcss.config.mjs'
      - 'scripts/postcss-heroui-scope.cjs'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: staging-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  containers:
    # El ejecutor estándar es gratuito para este repositorio público.
    # Revisar presupuesto antes de habilitarlo si cambia su visibilidad.
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    env:
      COMPOSE_FILE: deploy/staging/compose.yaml
      COMPOSE_ENV_FILES: deploy/staging/.env
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar datos y claves desechables del ensayo
        run: |
          node deploy/staging/init-local-env.mjs
          node <<'NODE'
          const fs = require('node:fs');
          for (const line of fs.readFileSync('deploy/staging/.env', 'utf8').split('\n')) {
            const separator = line.indexOf('=');
            if (separator > 0 && /PASSWORD|SECRET|KEY|TOKEN/.test(line.slice(0, separator))) {
              console.log(`::add-mask::${line.slice(separator + 1)}`);
            }
          }
          NODE
          docker compose config --quiet

      - name: Compilar backend Linux amd64 con chequeo de tipos
        run: docker build --platform linux/amd64 --target backend -f deploy/Dockerfile -t grafoprint-staging-api:local .

      - name: Compilar aplicación Next Linux amd64 con chequeo de tipos
        run: docker build --platform linux/amd64 --target web -f deploy/Dockerfile -t grafoprint-staging-web:local .

      - name: Crear base temporal y aplicar migraciones sin superusuario
        run: |
          docker compose up -d --wait --wait-timeout 120 postgres redis
          docker compose exec -T postgres psql -U staging_local_admin -d grafoprint_staging_test -v ON_ERROR_STOP=1 < deploy/staging/prepare-local-postgres.sql
          docker compose run --rm database-tools
          docker compose run --rm database-tools node scripts/deploy/runtime-role.cjs
          docker compose run --rm bootstrap
          docker compose run --rm database-tools node scripts/deploy/verify-database.cjs

      - name: Iniciar API y Next y comprobar login directo y por BFF
        run: |
          docker compose up -d --wait --wait-timeout 180 api web
          docker compose run --rm bootstrap node scripts/deploy/verify-http.cjs

      - name: Diagnóstico si falla el ensayo
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=80 api web postgres

      - name: Detener los servicios temporales del ejecutor
        if: always()
        run: docker compose down --remove-orphans
