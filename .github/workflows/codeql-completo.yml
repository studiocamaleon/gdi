name: Verificar correcciones CodeQL sin filtro de diff

on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/src/administracion/metodos-pago.service.ts'
      - 'apps/api/src/egresos/egresos.service.ts'
      - 'apps/api/src/productos-servicios/**'
      - 'apps/api/src/webhooks-whatsapp/**'
      - 'apps/forma-studio/**'
      - 'scripts/migrar-familia-css*'
      - '.github/workflows/codeql-completo.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codeql-completo-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql-completo:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Preparar la distribución oficial de CodeQL 2.27.6
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/codeql-tools"
          curl --fail --location --retry 3 \
            https://github.com/github/codeql-action/releases/download/codeql-bundle-v2.27.6/codeql-bundle-javascript-linux64.tar.zst \
            --output "$RUNNER_TEMP/codeql.tar.zst"
          echo "872a02eaa11b6ed6dac33796d1b964827d12ab93582db5479de579ea8f6a3539  $RUNNER_TEMP/codeql.tar.zst" | sha256sum --check
          tar --zstd -xf "$RUNNER_TEMP/codeql.tar.zst" -C "$RUNNER_TEMP/codeql-tools"
          echo "$RUNNER_TEMP/codeql-tools/codeql" >> "$GITHUB_PATH"
      - name: Analizar todo JavaScript y TypeScript, sin rangos del PR
        shell: bash
        run: |
          codeql database create "$RUNNER_TEMP/codeql-db" \
            --language=javascript-typescript --build-mode=none \
            --source-root="$GITHUB_WORKSPACE" --threads=2 --ram=6000
          codeql database analyze "$RUNNER_TEMP/codeql-db" \
            codeql/javascript-queries:codeql-suites/javascript-code-scanning.qls \
            --format=sarifv2.1.0 --threads=2 --ram=6000 \
            --output="$RUNNER_TEMP/codeql-completo.sarif"
      - name: Comprobar las cuatro reglas de las trece alertas
        shell: bash
        run: |
          node <<'JS'
          const fs = require('node:fs');
          const sarif = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/codeql-completo.sarif`, 'utf8'));
          const targets = ['js/regex-injection', 'js/polynomial-redos', 'js/reflected-xss', 'js/xss-through-dom'];
          const rules = sarif.runs.flatMap(run => [run.tool.driver, ...(run.tool.extensions || [])].flatMap(tool => tool.rules || []));
          if (targets.some(id => !rules.some(rule => rule.id === id))) throw new Error('Falta una regla requerida en el análisis.');
          const results = sarif.runs.flatMap(run => run.results || []);
          const counts = Object.fromEntries(targets.map(id => [id, results.filter(result => result.ruleId === id).length]));
          console.log(JSON.stringify({ revision: process.env.GITHUB_SHA, alcance: 'repositorio completo, sin filtro de diff', reglas: counts }));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, `Análisis completo de JavaScript/TypeScript (CodeQL 2.27.6).\n\n${Object.entries(counts).map(([id, count]) => `- ${id}: ${count}`).join('\n')}\n`);
          if (Object.values(counts).some(count => count !== 0)) throw new Error('Persisten alertas de las reglas corregidas.');
          JS
      # No se sube SARIF: default setup sigue siendo la fuente de alertas de GitHub.
      # Este control adicional comprueba las correcciones fuera de las líneas del diff.
