<!--
  ────────────────────────────────────────────────────────────────────────
  MESA DE LUZ — visualizador de la simulación del motor de ETA
  Grafoprint · prototipo para rediseño

  QUÉ ES
  Muestra qué decidió el motor de ETA: cada paso de cada orden, en qué
  estación, a qué hora, y por qué esperó lo que esperó.

  LOS DATOS SON REALES
  45 bloques extraídos del taller de Grafica Corporearte (18 OTs, 5
  estaciones, lun 20/07/2026 08:00). Están en la constante DATOS, más
  abajo. NO son de ejemplo: la densidad que ves es la densidad real, y
  el diseño tiene que aguantarla.

  TRES RESTRICCIONES QUE NO SON NEGOCIABLES
  1. El eje X NO es tiempo lineal: son MINUTOS LABORALES (L-V 08:00-18:00,
     noches y fines de semana colapsados). El horizonte real son 15
     jornadas con bloques de mediana 10 min; en tiempo lineal es
     ilegible. Los valores x0/x1 ya vienen calculados en ese eje.
  2. Las duraciones van de 0 a 500 min. Hace falta un ANCHO MÍNIMO de
     bloque o la mitad desaparece — a cambio, dos pasos cortos seguidos
     se solapan en pantalla. Es una tensión inherente, no un bug.
  3. Cada carril reparte sus bloques en SUB-FILAS según los puestos
     simultáneos de la estación (capacidadConcurrente). El carril "Sin
     estación asignada" tiene capacidad infinita y necesita 4 filas.

  CONTRATO DE DATOS COMPLETO
  docs/simulacion-mesa-de-luz-diseno.md, sección 2.

  LIBRE PARA REDISEÑAR
  Toda la capa visual: paleta, tipografía, formas, densidad, motion,
  la disposición del inspector, el tratamiento de la barra superior.
  La estructura de DATOS y el cálculo de posiciones conviene conservarlos.
  ────────────────────────────────────────────────────────────────────────
-->

<style>
:root{
  /* Mesa encendida — tinta de imprenta, sesgo azul */
  --ink:#070B14; --film:#0E1626; --film-2:#141F33; --haze:#1C2942;
  --line:#22314E; --hair:#18243A;
  --txt:#E8EEF9; --txt-2:#8FA3C4; --txt-3:#5C7099;
  --cyan:#22D3EE;            /* la voz del sistema */
  --hot:#FF3D8B;             /* no llega */
  --amber:#FFB020;           /* supuesto */
  --good:#2DD4A7;
  --glow:0 0 0 1px rgba(34,211,238,.35), 0 0 22px -4px rgba(34,211,238,.55);
  --mono:ui-monospace,"SF Mono",SFMono-Regular,"JetBrains Mono",Menlo,Consolas,monospace;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif;
  --lane-pad:6px; --row-h:26px;
}
@media (prefers-color-scheme:light){
  :root{
    --ink:#F4F6FA; --film:#FFFFFF; --film-2:#EEF2F8; --haze:#E2E8F2;
    --line:#CBD5E6; --hair:#DFE6F0;
    --txt:#0D1526; --txt-2:#4A5B78; --txt-3:#7A89A6;
    --cyan:#0284A8; --hot:#D6006B; --amber:#B26A00; --good:#0F9A78;
    --glow:0 0 0 1px rgba(2,132,168,.4), 0 2px 12px -3px rgba(2,132,168,.35);
  }
}
:root[data-theme="dark"]{
  --ink:#070B14; --film:#0E1626; --film-2:#141F33; --haze:#1C2942;
  --line:#22314E; --hair:#18243A;
  --txt:#E8EEF9; --txt-2:#8FA3C4; --txt-3:#5C7099;
  --cyan:#22D3EE; --hot:#FF3D8B; --amber:#FFB020; --good:#2DD4A7;
  --glow:0 0 0 1px rgba(34,211,238,.35), 0 0 22px -4px rgba(34,211,238,.55);
}
:root[data-theme="light"]{
  --ink:#F4F6FA; --film:#FFFFFF; --film-2:#EEF2F8; --haze:#E2E8F2;
  --line:#CBD5E6; --hair:#DFE6F0;
  --txt:#0D1526; --txt-2:#4A5B78; --txt-3:#7A89A6;
  --cyan:#0284A8; --hot:#D6006B; --amber:#B26A00; --good:#0F9A78;
  --glow:0 0 0 1px rgba(2,132,168,.4), 0 2px 12px -3px rgba(2,132,168,.35);
}

*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:var(--txt);font-family:var(--sans);
  font-size:13px;-webkit-font-smoothing:antialiased}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.eyebrow{font-family:var(--mono);font-size:10px;text-transform:uppercase;
  letter-spacing:.16em;color:var(--txt-3)}

/* ── Barra de mando ── */
.bar{display:flex;align-items:center;gap:18px;flex-wrap:wrap;
  padding:14px 20px;border-bottom:1px solid var(--line);background:var(--film);
  position:sticky;top:0;z-index:40}
.brand h1{font-family:var(--mono);font-size:15px;font-weight:600;margin:0;
  letter-spacing:-.01em}
.brand .sub{font-size:11.5px;color:var(--txt-2);margin-top:2px}
.stats{display:flex;gap:16px;margin-left:auto;flex-wrap:wrap}
.stat .k{font-family:var(--mono);font-size:17px;font-weight:600;line-height:1.1;
  font-variant-numeric:tabular-nums}
.stat .l{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;
  letter-spacing:.13em;color:var(--txt-3);margin-top:3px}
.stat.hot .k{color:var(--hot)} .stat.amber .k{color:var(--amber)}
.stat.cyan .k{color:var(--cyan)}

.ctl{display:flex;align-items:center;gap:6px}
button,select{font:inherit;font-family:var(--mono);font-size:11.5px;
  background:var(--film-2);color:var(--txt);border:1px solid var(--line);
  border-radius:7px;padding:6px 11px;cursor:pointer;transition:.14s}
button:hover,select:hover{border-color:var(--cyan);color:var(--cyan)}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
button.on{background:var(--cyan);border-color:var(--cyan);color:var(--ink);font-weight:600}

/* ── Cubierta ── */
.deck{display:flex;align-items:stretch;overflow:hidden;border-bottom:1px solid var(--line)}
.gutter{flex:none;width:208px;background:var(--film);border-right:1px solid var(--line);
  z-index:20;position:relative}
.gutter .head{height:34px;border-bottom:1px solid var(--line);display:flex;
  align-items:center;padding:0 14px}
.lane-lbl{display:flex;flex-direction:column;justify-content:center;gap:3px;
  padding:0 14px;border-bottom:1px solid var(--hair)}
.lane-lbl .n{font-size:12px;font-weight:600;letter-spacing:-.01em;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lane-lbl .m{font-family:var(--mono);font-size:9.5px;color:var(--txt-3);
  letter-spacing:.06em}
.lane-lbl.warn{background:linear-gradient(90deg,rgba(255,176,32,.10),transparent)}
.lane-lbl.warn .n{color:var(--amber)}

.scroll{flex:1;overflow-x:auto;overflow-y:hidden}
.stage{position:relative}
.axis{height:34px;border-bottom:1px solid var(--line);position:relative;
  background:var(--film)}
.day{position:absolute;top:0;height:34px;border-left:1px solid var(--hair);
  display:flex;align-items:center;padding-left:8px}
.day span{font-family:var(--mono);font-size:9.5px;color:var(--txt-3);
  text-transform:uppercase;letter-spacing:.1em}
.day.wk{border-left-color:var(--line)}
.lane{position:relative;border-bottom:1px solid var(--hair)}
.lane.warn{background:repeating-linear-gradient(45deg,transparent,transparent 9px,
  rgba(255,176,32,.045) 9px,rgba(255,176,32,.045) 18px)}
.gridline{position:absolute;top:0;bottom:0;width:1px;background:var(--hair)}

/* ── Bloques ── */
.blk{position:absolute;height:var(--row-h);border-radius:4px;cursor:pointer;
  overflow:hidden;display:flex;align-items:center;padding:0 5px;
  border:1px solid transparent;transition:opacity .18s,transform .18s,box-shadow .18s;
  min-width:4px}
.blk .t{font-family:var(--mono);font-size:10px;font-weight:600;white-space:nowrap;
  overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.blk:hover{transform:translateY(-1px);z-index:12}
.blk.dim{opacity:.13}
.blk.sel{box-shadow:var(--glow);z-index:14}
.blk.terc{border-style:dashed;border-width:1.5px;background-image:
  repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,255,255,.10) 4px,rgba(255,255,255,.10) 8px)}
.blk.pend{opacity:0;pointer-events:none}
.blk.tarde::after{content:"";position:absolute;inset:0;border-radius:3px;
  box-shadow:inset 0 0 0 1.5px var(--hot)}

.now{position:absolute;top:0;bottom:0;width:2px;background:var(--cyan);
  box-shadow:0 0 14px 2px rgba(34,211,238,.55);z-index:15;pointer-events:none}
.thread{position:absolute;inset:0;pointer-events:none;z-index:13;overflow:visible}

/* ── Consola ── */
.console{display:flex;align-items:center;gap:16px;padding:12px 20px;
  background:var(--film);border-bottom:1px solid var(--line);flex-wrap:wrap}
.console input[type=range]{flex:1;min-width:220px;accent-color:var(--cyan);cursor:pointer}
.readout{flex-basis:100%;font-family:var(--mono);font-size:11.5px;color:var(--txt-2);
  line-height:1.6;min-height:2.9em}
.readout b{color:var(--txt);font-weight:600}
.readout .c{color:var(--cyan)} .readout .h{color:var(--hot)} .readout .a{color:var(--amber)}

/* ── Inspector ── */
.insp{position:fixed;top:0;right:0;bottom:0;width:min(380px,92vw);z-index:60;
  background:var(--film);border-left:1px solid var(--line);
  transform:translateX(101%);transition:transform .28s cubic-bezier(.4,0,.2,1);
  display:flex;flex-direction:column;box-shadow:-20px 0 50px -20px rgba(0,0,0,.6)}
.insp.open{transform:none}
.insp .h{padding:16px 18px;border-bottom:1px solid var(--line)}
.insp .b{padding:16px 18px;overflow-y:auto;flex:1;display:flex;flex-direction:column;gap:16px}
.insp h2{font-family:var(--mono);font-size:14px;margin:6px 0 2px;letter-spacing:-.01em}
.row{display:flex;justify-content:space-between;gap:12px;padding:7px 0;
  border-bottom:1px solid var(--hair);font-size:12px}
.row:last-child{border-bottom:none}
.row .k{color:var(--txt-3);font-family:var(--mono);font-size:10px;
  text-transform:uppercase;letter-spacing:.1em;padding-top:1px}
.row .v{font-family:var(--mono);font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.note{font-size:12px;line-height:1.65;color:var(--txt-2);
  border-left:2px solid var(--cyan);padding:2px 0 2px 12px}
.note.a{border-color:var(--amber)} .note.h{border-color:var(--hot)}
.x{position:absolute;top:14px;right:16px;padding:4px 9px}

.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 20px;
  border-bottom:1px solid var(--line);background:var(--ink)}
.lg{display:flex;align-items:center;gap:6px;font-family:var(--mono);
  font-size:10px;color:var(--txt-3);letter-spacing:.05em}
.sw{width:16px;height:9px;border-radius:2px;flex:none}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<script>
const D = DATOS;
const TINTAS = ["#22D3EE","#FF3D8B","#FFB020","#8B7BFF","#2DD4A7","#FF7A45","#4CC2FF","#C77DFF"];
const OTS = [...new Set(D.bloques.map(b=>b.ot))].sort();
const tinta = ot => TINTAS[OTS.indexOf(ot) % TINTAS.length];
const ROW = 26, PAD = 6;

let z = 0.16, corte = D.bloques.length, soloTarde = false, sel = null, hov = null;

/* Empaquetado: cada carril reparte sus bloques en sub-filas sin solaparse. */
const carriles = D.estaciones.map(e=>{
  const bs = D.bloques.filter(b=>b.est===e.nombre).sort((a,b)=>a.x0-b.x0);
  const filas=[];
  bs.forEach(b=>{
    let f = filas.findIndex(r => r[r.length-1].x1 <= b.x0);
    if(f<0){ filas.push([b]); f=filas.length-1; } else filas[f].push(b);
    b._fila = f;
  });
  return {...e, bloques:bs, filas:Math.max(1,filas.length)};
}).filter(c=>c.bloques.length>0);

const alturaCarril = c => c.filas*ROW + (c.filas+1)*PAD;
const resPorItem = new Map(D.res.map(r=>[r.itemId,r]));

/* ── Render ── */
function render(){
  const W = D.maxX*z + 60;
  document.getElementById("stage").style.width = W+"px";

  /* Eje */
  const ax = document.getElementById("axis");
  ax.innerHTML = "";
  D.dias.forEach((d,i)=>{
    const el = document.createElement("div");
    el.className = "day" + (i%5===0?" wk":"");
    el.style.left = (d.x*z)+"px";
    el.style.width = (D.jornadaMin*z)+"px";
    if(D.jornadaMin*z > 46) el.innerHTML = "<span>"+d.lbl+"</span>";
    ax.appendChild(el);
  });

  /* Carriles */
  const g = document.getElementById("gutter");
  const L = document.getElementById("lanes");
  g.querySelectorAll(".lane-lbl").forEach(n=>n.remove());
  L.innerHTML = "";

  carriles.forEach(c=>{
    const h = alturaCarril(c);
    const warn = c.key==="__sin_estacion__";

    const lbl = document.createElement("div");
    lbl.className = "lane-lbl" + (warn?" warn":"");
    lbl.style.height = h+"px";
    const meta = c.key==="__proveedor__" ? "externo · "+c.bloques.length+" pasos"
      : c.puestos ? c.puestos+" puesto"+(c.puestos>1?"s":"")+" · "+c.bloques.length+" pasos"
      : "sin límite · "+c.bloques.length+" pasos";
    lbl.innerHTML = '<div class="n">'+c.nombre+'</div><div class="m">'+meta+'</div>';
    g.appendChild(lbl);

    const lane = document.createElement("div");
    lane.className = "lane" + (warn?" warn":"");
    lane.style.height = h+"px";
    D.dias.forEach(d=>{
      const gl = document.createElement("div");
      gl.className="gridline"; gl.style.left=(d.x*z)+"px"; lane.appendChild(gl);
    });

    c.bloques.forEach(b=>{
      const r = resPorItem.get(b.itemId);
      const el = document.createElement("div");
      const col = tinta(b.ot);
      el.className = "blk" + (b.terc?" terc":"") + (r&&r.tarde?" tarde":"");
      el.style.left = (b.x0*z)+"px";
      el.style.width = Math.max(4,(b.x1-b.x0)*z)+"px";
      el.style.top = (PAD + b._fila*(ROW+PAD))+"px";
      el.style.background = col+"26";
      el.style.borderColor = col+"88";
      el.style.color = col;
      el.dataset.i = b.i;
      const w = (b.x1-b.x0)*z;
      if(w > 54) el.innerHTML = '<span class="t">'+b.ot.replace("OT-2026-","")+' · '+b.paso+'</span>';
      else if(w > 22) el.innerHTML = '<span class="t">'+b.ot.replace("OT-2026-","")+'</span>';
      el.title = b.ot+" · "+b.paso+"\n"+b.s.d+" "+b.s.h+" → "+b.e.h+
        (b.dur!=null?"  ("+b.dur+" min)":"  ("+b.plazo+" días proveedor)");
      el.addEventListener("click",()=>abrir(b));
      el.addEventListener("mouseenter",()=>{hov=b.ot;pintar();});
      el.addEventListener("mouseleave",()=>{hov=null;pintar();});
      lane.appendChild(el);
    });
    L.appendChild(lane);
  });

  const now = document.createElement("div");
  now.className="now"; now.style.left="0px";
  document.getElementById("lanes").appendChild(now);

  pintar();
}

/* Atenuado, corte del replay y el hilo del recorrido */
function pintar(){
  const foco = hov || (sel && sel.ot);
  document.querySelectorAll(".blk").forEach(el=>{
    const b = D.bloques[+el.dataset.i];
    const r = resPorItem.get(b.itemId);
    const fueraCorte = b.i >= corte;
    const fueraFiltro = soloTarde && !(r&&r.tarde);
    el.classList.toggle("pend", fueraCorte);
    el.classList.toggle("dim", !fueraCorte && (fueraFiltro || (foco && b.ot!==foco)));
    /* Por índice de decisión: es lo único único por bloque. */
    el.classList.toggle("sel", !!(sel && sel.i===b.i));
  });
  hilo(foco);
  document.getElementById("cnt").textContent = Math.min(corte,D.bloques.length)+" / "+D.bloques.length+" decisiones";
}

/* El hilo: une los pasos de una misma OT en el orden en que se producen. */
function hilo(ot){
  const svg = document.getElementById("thread");
  svg.innerHTML="";
  if(!ot) return;
  const stage = document.getElementById("stage");
  svg.setAttribute("width", stage.style.width);
  svg.setAttribute("height", stage.scrollHeight);
  const axH = 34;
  let yOff = axH;
  const pts=[];
  carriles.forEach(c=>{
    c.bloques.forEach(b=>{
      if(b.ot!==ot || b.i>=corte) return;
      pts.push({x0:b.x0*z, x1:Math.max(b.x0*z+4,b.x1*z),
                y: yOff + PAD + b._fila*(ROW+PAD) + ROW/2,
                idx:b.pasoIndice, item:b.itemId});
    });
    yOff += alturaCarril(c);
  });
  if(pts.length<1) return;
  const col = tinta(ot);
  /* Una OT puede tener varios items, y cada item tiene su propia secuencia
     de pasos. Un solo hilo mezclándolos iría hacia atrás en el tiempo: se
     dibuja un hilo por item. */
  const porItem = new Map();
  pts.forEach(p=>{ if(!porItem.has(p.item)) porItem.set(p.item,[]); porItem.get(p.item).push(p); });
  porItem.forEach(grupo=>{
    grupo.sort((a,b)=>a.idx-b.idx);
    let dd="";
    grupo.forEach((p,i)=>{
      if(i>0){ const prev=grupo[i-1];
        if(p.x0 >= prev.x1){
          const mx=(prev.x1+p.x0)/2;
          dd += " M "+prev.x1+" "+prev.y+
                " C "+mx+" "+prev.y+", "+mx+" "+p.y+", "+p.x0+" "+p.y;
        } else {
          /* Pasos encadenados sin hueco: el ancho mínimo de bloque los hace
             solaparse en pantalla. Un conector vertical dice la verdad
             (la posta pasa de un carril al otro) sin dibujar hacia atrás. */
          dd += " M "+p.x0+" "+prev.y+" L "+p.x0+" "+p.y;
        } }
    });
    if(dd){
      const path=document.createElementNS("http://www.w3.org/2000/svg","path");
      path.setAttribute("d",dd.trim()); path.setAttribute("fill","none");
      path.setAttribute("stroke",col); path.setAttribute("stroke-width","1.5");
      path.setAttribute("stroke-dasharray","4 3"); path.setAttribute("opacity",".85");
      svg.appendChild(path);
    }
    grupo.forEach(p=>{
      const ci=document.createElementNS("http://www.w3.org/2000/svg","circle");
      ci.setAttribute("cx",p.x0); ci.setAttribute("cy",p.y); ci.setAttribute("r","2.5");
      ci.setAttribute("fill",col); svg.appendChild(ci);
    });
  });
}

/* ── Inspector ── */
function abrir(b){
  sel=b; pintar();
  const r=resPorItem.get(b.itemId);
  const col=tinta(b.ot);
  document.getElementById("insphead").innerHTML =
    '<div class="eyebrow">Decisión '+(b.i+1)+' de '+D.bloques.length+'</div>'+
    '<h2 style="color:'+col+'">'+b.ot+' · '+b.paso+'</h2>'+
    '<div style="font-size:11.5px;color:var(--txt-2)">'+b.item+' — '+b.cli+'</div>';

  const esperaH=(b.espera/60);
  let notas="";
  if(b.espera>0) notas += '<div class="note">Esperó <b>'+esperaH.toFixed(1)+' h</b> a que se liberara un puesto en '+b.est+
    '. El trabajo estaba listo antes, pero la estación estaba ocupada.</div>';
  if(b.terc) notas += '<div class="note a">Paso tercerizado: no ocupa puesto del taller. Corre en el calendario del proveedor, <b>'+b.plazo+' días hábiles</b>.</div>';
  if(b.est==="Sin estación asignada") notas += '<div class="note a">La familia <b>'+b.fam+'</b> no está asignada a ninguna estación. El motor lo programa con capacidad infinita — <b>esta parte del plan es optimista</b>.</div>';
  if(b.dur===0) notas += '<div class="note">Duración cero real: el paso existe en la ruta pero no consume tiempo de máquina.</div>';
  if(r&&r.tarde) notas += '<div class="note h">Este item termina el <b>'+r.fin.d+' '+r.fin.h+'</b> y la entrega comprometida es el <b>'+r.entrega+'</b>. No llega.</div>';
  if(b.comp>1) notas += '<div class="note">En este turno el scheduler evaluó <b>'+b.comp+' candidatos</b> y eligió éste porque podía arrancar antes.</div>';

  document.getElementById("inspbody").innerHTML =
    '<div>'+
      fila("Estación", b.est)+
      fila("Familia", b.fam)+
      fila("Arranca", b.s.d+" "+b.s.h)+
      fila("Termina", b.e.d+" "+b.e.h)+
      (b.dur!=null?fila("Duración", b.dur+" min"):fila("Plazo proveedor", b.plazo+" días"))+
      fila("Espera previa", esperaH>0?esperaH.toFixed(1)+" h":"—")+
      fila("Paso nº", b.pasoIndice)+
    '</div>'+
    (r?'<div><div class="eyebrow" style="margin-bottom:6px">Resultado del item</div>'+
      fila("Fin estimado", r.fin? r.fin.d+" "+r.fin.h : "sin estimar")+
      fila("Entrega", r.entrega??"—")+
      fila("Estado", r.tarde?"NO LLEGA":"en fecha")+'</div>':'')+
    notas;
  document.getElementById("insp").classList.add("open");
  document.getElementById("insp").setAttribute("aria-hidden","false");
}
const fila=(k,v)=>'<div class="row"><span class="k">'+k+'</span><span class="v">'+v+'</span></div>';

document.getElementById("close").onclick=()=>{
  sel=null;pintar();
  const i=document.getElementById("insp");
  i.classList.remove("open");i.setAttribute("aria-hidden","true");
};

/* ── Replay: en ORDEN DE DECISIÓN, no cronológico ── */
const scrub=document.getElementById("scrub");
scrub.max=D.bloques.length;
function readout(){
  const el=document.getElementById("readout");
  if(corte===0){el.innerHTML='<span style="color:var(--txt-3)">Taller vacío. El scheduler todavía no colocó nada.</span>';return;}
  if(corte>=D.bloques.length){
    const t=D.res.filter(r=>r.tarde).length;
    el.innerHTML='Plan completo: <b>'+D.bloques.length+' pasos</b> repartidos en <b>'+carriles.length+' carriles</b>. '+
      '<span class="h">'+t+' items no llegan</span> a su fecha comprometida. '+
      '<span style="color:var(--txt-3)">Pasá el mouse por un bloque para seguir el recorrido de esa orden.</span>';
    return;}
  const b=D.bloques[corte-1];
  el.innerHTML='<b>Decisión '+corte+'</b> — coloca <span class="c">'+b.ot+' · '+b.paso+'</span> en <b>'+b.est+'</b>, '+
    'arranca <b>'+b.s.d+' '+b.s.h+'</b>'+
    (b.espera>0?' tras esperar <span class="a">'+(b.espera/60).toFixed(1)+' h</span> por un puesto libre':' apenas queda libre')+
    (b.dur!=null?' · '+b.dur+' min':' · '+b.plazo+' d proveedor')+
    (b.comp>1?' <span style="color:var(--txt-3)">('+b.comp+' candidatos en juego)</span>':'');
}
scrub.oninput=()=>{corte=+scrub.value;pintar();readout();};

let tocando=null;
document.getElementById("play").onclick=function(){
  if(tocando){clearInterval(tocando);tocando=null;this.textContent="▶ Reproducir";return;}
  if(corte>=D.bloques.length) corte=0;
  this.textContent="⏸ Pausar";
  tocando=setInterval(()=>{
    corte++;scrub.value=corte;pintar();readout();
    if(corte>=D.bloques.length){clearInterval(tocando);tocando=null;
      document.getElementById("play").textContent="▶ Reproducir";}
  },230);
};
document.getElementById("all").onclick=()=>{corte=D.bloques.length;scrub.value=corte;pintar();readout();};
document.getElementById("late").onclick=function(){soloTarde=!soloTarde;this.classList.toggle("on",soloTarde);pintar();};
document.querySelectorAll("[data-z]").forEach(btn=>{
  btn.onclick=()=>{z=+btn.dataset.z;
    document.querySelectorAll("[data-z]").forEach(b=>b.classList.remove("on"));
    btn.classList.add("on");render();readout();};
});

/* ── KPIs y leyenda ── */
const totalMin=D.bloques.reduce((s,b)=>s+(b.dur||0),0);
const sinEst=D.bloques.filter(b=>b.est==="Sin estación asignada").reduce((s,b)=>s+(b.dur||0),0);
document.getElementById("stats").innerHTML=[
  ['<span class="k">'+D.res.length+'</span>','items en cola',''],
  ['<span class="k">'+(totalMin/60).toFixed(1)+' h</span>','trabajo programado',''],
  ['<span class="k">'+Math.round(sinEst/totalMin*100)+'%</span>','sin estación real','amber'],
  ['<span class="k">'+D.res.filter(r=>r.tarde).length+'</span>','no llegan','hot'],
  ['<span class="k">'+(D.maxX/D.jornadaMin).toFixed(0)+'</span>','jornadas de horizonte','cyan'],
].map(([k,l,c])=>'<div class="stat '+c+'">'+k+'<div class="l">'+l+'</div></div>').join("");

document.getElementById("legend").innerHTML =
  OTS.slice(0,8).map(ot=>'<span class="lg"><span class="sw" style="background:'+tinta(ot)+'44;box-shadow:inset 0 0 0 1px '+tinta(ot)+'"></span>'+ot.replace("OT-2026-","OT ")+'</span>').join("")+
  '<span class="lg" style="margin-left:auto"><span class="sw" style="box-shadow:inset 0 0 0 1.5px var(--hot)"></span>no llega a la fecha</span>'+
  '<span class="lg"><span class="sw" style="border:1.5px dashed var(--txt-3)"></span>tercerizado</span>'+
  '<span class="lg"><span class="sw" style="background:repeating-linear-gradient(45deg,transparent,transparent 4px,rgba(255,176,32,.5) 4px,rgba(255,176,32,.5) 8px)"></span>sin estación real</span>';

render(); readout();
</script>
</body>
</html>
