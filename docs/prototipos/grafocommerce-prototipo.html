@media(max-width:620px){#gc-prototype .gc-lab{padding:12px 16px;gap:12px}#gc-prototype .gc-switch{width:100%}#gc-prototype .gc-switch button{flex:1}#gc-prototype .gc-demo{padding:8px 16px;font-size:10px}#gc-prototype .gc-header{padding:17px 18px}#gc-prototype .gc-logo{font-size:20px;gap:7px}#gc-prototype .gc-logo-mark{width:29px;height:29px;font-size:16px}#gc-prototype .gc-nav>.gc-link{display:none}#gc-prototype .gc-nav{gap:8px}#gc-prototype .gc-nav .gc-btn{padding:8px}#gc-prototype .gc-pad{padding:22px 18px}#gc-prototype .gc-hero{grid-template-columns:1fr}#gc-prototype .gc-hero-copy{padding:32px 22px}#gc-prototype .gc-hero h1{font-size:46px}#gc-prototype .gc-hero-art{min-height:235px}#gc-prototype .gc-hero-art:before{top:-30px}#gc-prototype .gc-products,#gc-prototype .gc-layout{grid-template-columns:1fr}#gc-prototype .gc-tile-art{height:195px}#gc-prototype .gc-trust{padding:15px 18px;font-size:10px}#gc-prototype .gc-trust span:nth-child(3){display:none}#gc-prototype .gc-section-head>.gc-eyebrow{display:none}#gc-prototype .gc-help,#gc-prototype .gc-next{flex-direction:column;align-items:flex-start}#gc-prototype h1{font-size:32px}#gc-prototype h2{font-size:23px}#gc-prototype .gc-footer{padding:15px 18px;flex-direction:column;gap:5px}#gc-prototype .gc-cart-row{grid-template-columns:44px minmax(0,1fr);gap:11px}#gc-prototype .gc-item-icon{height:44px}#gc-prototype .gc-item-price{grid-column:2}#gc-prototype .gc-progress{grid-template-columns:1fr 1fr;gap:18px}#gc-prototype .gc-admin{grid-template-columns:1fr}#gc-prototype .gc-sidebar{padding:13px 18px;display:flex;justify-content:space-between;align-items:center}#gc-prototype .gc-grafo{margin:0;font-size:20px}#gc-prototype .gc-company,#gc-prototype .gc-admin-nav:not(.gc-active){display:none}#gc-prototype .gc-admin-nav{margin:0;padding:7px 9px}#gc-prototype .gc-admin-main{padding:23px 16px}#gc-prototype .gc-review{grid-template-columns:1fr}#gc-prototype .gc-review .gc-btn{justify-self:start}#gc-prototype .gc-confirm{gap:12px}#gc-prototype .gc-confirm h1{font-size:29px}#gc-prototype .gc-check{width:35px;height:35px}#gc-prototype .gc-field :is(input,select){font-size:16px}#gc-prototype .gc-btn{min-height:42px}#gc-prototype .gc-order-foot{align-items:flex-start;flex-direction:column}}
@media(prefers-reduced-motion:no-preference){#gc-prototype .gc-btn,#gc-prototype .gc-choice{transition:background .15s}#gc-prototype .gc-tile:hover .gc-print-card{transform:rotate(-4deg) translateY(-3px);transition:transform .2s}}
@media(max-width:360px){#gc-prototype .gc-header{padding:16px 14px;gap:9px}#gc-prototype .gc-logo{font-size:18px}#gc-prototype .gc-logo-mark{width:25px;height:25px}#gc-prototype .gc-nav .gc-btn{padding:7px;gap:5px;font-size:11px}}

<script>
(() => {
  const R=document.getElementById('gc-prototype'),V=R.querySelector('#gc-view');
  const ic=n=>'<i data-lucide="'+n+'" aria-hidden="true"></i>';
  const esc=x=>String(x??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
  const cash=n=>new Intl.NumberFormat('es-AR',{style:'currency',currency:'ARS',maximumFractionDigits:0}).format(n);
  const fresh=kind=>({kind,qty:kind==='cards'?500:1,format:'9 × 5 cm',weight:'350 g',sides:'Doble faz',finish:'Sin laminado',width:100,height:70,eyelets:'Perimetrales',file:'',approved:false});
  let S={version:1,screen:'home',mode:'store',config:fresh('cards'),cart:[],orders:[],selected:0,editing:-1,payment:'card',error:''};
  const D={accent:'#ff7546',spacing:'Cómoda'};
  const btn=(label,act,extra='',cls='')=>'<button type="button" class="gc-btn '+cls+'" data-act="'+act+'" '+extra+'>'+label+'</button>';
  const link=(label,act,extra='')=>'<button type="button" class="gc-link" data-act="'+act+'" '+extra+'>'+label+'</button>';
  const badge=(label,cls='')=>'<span class="gc-badge '+cls+'">'+label+'</span>';
  const title=c=>c.kind==='cards'?'Tarjetas de visita':'Lona a medida';
  const info=c=>c.kind==='cards'?c.qty+' unidades · '+c.format+' · '+c.weight+' · '+c.sides+' · '+c.finish:c.qty+' '+(Number(c.qty)===1?'unidad':'unidades')+' · '+c.width+' × '+c.height+' cm · Frontlit 440 g · '+c.eyelets;
  function price(c){
    if(c.kind==='cards')return Math.round((12000+Number(c.qty)*(c.qty>=1000?39:c.qty>=500?46:57))*(c.weight==='350 g'?1.08:1)*(c.sides==='Doble faz'?1.13:1)+(c.finish==='Mate'?c.qty*9:0));
    return Math.round((Math.max(.25,(Number(c.width)||0)*(Number(c.height)||0)/10000)*16500+(c.eyelets==='Perimetrales'?2700:0))*Number(c.qty||0));
  }
  const sum=items=>items.reduce((a,c)=>a+price(c),0);
  const total=n=>'<div class="gc-total">'+cash(n)+'<small>ARS · IVA incluido</small></div>';
  const line=(a,b)=>'<div class="gc-line"><span>'+a+'</span><span>'+b+'</span></div>';
  function invalid(c){return c.kind==='banner'&&(!(c.width>=20&&c.width<=150)||!(c.height>=20&&c.height<=500)||!(c.qty>=1&&c.qty<=20&&Number.isInteger(Number(c.qty))))?'Usá un ancho de 20 a 150 cm, un alto de 20 a 500 cm y entre 1 y 20 unidades.':'';}
  function validItem(c){return c&&['cards','banner'].includes(c.kind)&&Number(c.qty)>0&&Number(c.qty)<=5000;}
  function restore(w){const p=w?.privateContent;if(p?.version!==1)return;S={...S,...p,error:''};if(!['home','product','cart','checkout','confirmation'].includes(S.screen))S.screen='home';S.mode=p.mode==='admin'?'admin':'store';S.config=validItem(p.config)?p.config:fresh('cards');S.cart=Array.isArray(p.cart)?p.cart.filter(validItem).slice(0,8):[];S.orders=Array.isArray(p.orders)?p.orders.filter(o=>Array.isArray(o.items)&&o.items.every(validItem)).slice(0,3):[];S.selected=Math.max(0,Math.min(Number(p.selected)||0,S.orders.length-1));if(!S.orders.length&&S.screen==='confirmation')S.screen='home';if(!S.cart.length&&S.screen==='checkout')S.screen='cart';if(/^#[0-9a-f]{6}$/i.test(p.design?.accent||''))D.accent=p.design.accent;D.spacing=p.design?.spacing==='Compacta'?'Compacta':'Cómoda';}
  function save(){const o=S.orders[S.selected];window.openai?.setWidgetState?.({modelContent:{prototipo:'GrafoCommerce',vista:S.mode==='admin'?'Pedido en Grafo':S.screen,producto:title(S.config),itemsCarrito:S.cart.length,pedidosDePrueba:S.orders.length,pago:o?.payment??null,otDePrueba:o?.ot??null,acento:D.accent,espaciado:D.spacing},privateContent:{...S,error:'',design:D}})?.catch(()=>{});}
  function art(kind,hero=false){
    if(kind==='banner')return '<div class="gc-print-banner"><span class="gc-print-small">FESTIVAL CREATIVO</span><span class="gc-banner-name">Ideas<br>en grande.</span><span class="gc-print-small">DISEÑO · MÚSICA · ENCUENTROS</span></div>';
    return (hero?'<div class="gc-print-card gc-print-back"><span class="gc-print-small">ESTUDIO BOTÁNICO</span><span class="gc-print-name">Crecer,<br>naturalmente.</span></div>':'')+'<div class="gc-print-card '+(hero?'gc-print-front':'')+'"><span class="gc-print-small">BOTÁNICA · ESTUDIO</span><span class="gc-print-name">Ideas que<br>florecen.</span><span class="gc-print-small">DISEÑO QUE FLORECE</span></div>';
  }
  function header(){return '<header class="gc-header"><button type="button" class="gc-logo" data-act="home" aria-label="Ir al inicio de Corporearte"><span class="gc-logo-mark">co.</span><span>corporearte<b>.</b></span></button><nav class="gc-nav" aria-label="Tienda">'+link('Productos','catalog')+(S.orders.length?link('Mi pedido','myorder'):'')+btn(ic('shopping-bag')+'Carrito <span class="gc-count">'+S.cart.length+'</span>','cart','aria-label="Ver carrito, '+S.cart.length+' productos"')+'</nav></header>';}
  const footer=()=>'<footer class="gc-footer"><span>Gráfica Corporearte · Impresión con oficio.</span><span>Con tecnología <strong>GrafoCommerce.</strong></span></footer>';
  function tile(kind){const c=fresh(kind);return '<article class="gc-tile"><div class="gc-tile-art" role="img" aria-label="Muestra impresa de '+title(c)+'">'+art(kind)+'</div><div class="gc-tile-copy"><div><h3>'+title(c)+'</h3><p>'+(kind==='cards'?'Una buena primera impresión.':'Tu mensaje, al tamaño de tu idea.')+'</p></div>'+badge(kind==='cards'?'Formato fijo':'A medida')+'</div><div class="gc-tile-foot"><div class="gc-price">'+cash(price(c))+'<small>'+(kind==='cards'?'500 unidades · 350 g · doble faz':'100 × 70 cm · con ojales')+' · IVA incluido</small></div>'+btn('Configurar '+ic('arrow-up-right'),'product','data-kind="'+kind+'"','gc-small')+'</div></article>';}
  function home(){return header()+'<section class="gc-hero"><div class="gc-hero-copy"><span class="gc-eyebrow">DE TU IDEA A TUS MANOS</span><h1>Tus ideas.<br><span class="gc-muted">Bien impresas.</span></h1><p>Elegí, personalizá y pedí online. Nosotros nos ocupamos de hacerlas realidad.</p>'+btn('Encontrá tu producto '+ic('arrow-right'),'catalog','','gc-dark')+'</div><div class="gc-hero-art" role="img" aria-label="Tarjetas impresas en verde profundo y papel terracota">'+art('cards',true)+'<span class="gc-art-tag">Hecho para tu marca</span><span class="gc-art-label">PAPEL. COLOR. PERSONALIDAD.</span></div></section><div class="gc-trust"><span>'+ic('sliders-horizontal')+'Configurá a tu manera</span><span>'+ic('file-check-2')+'Revisamos tu archivo</span><span>'+ic('package-check')+'Seguí cada paso</span></div><section class="gc-pad" id="gc-catalog"><div class="gc-section-head"><div><span class="gc-eyebrow">EMPEZÁ POR ACÁ</span><h2>¿Qué vamos a imprimir?</h2><p>Dos formas de darle vida a tu próximo proyecto.</p></div><span class="gc-eyebrow">01 — CATÁLOGO</span></div><div class="gc-products">'+tile('cards')+tile('banner')+'</div><div class="gc-help"><div><h3>Simple, desde el primer clic.</h3><p>Configurá tu producto, adjuntá el PDF y revisá tu pedido.</p></div>'+badge('Retiro en nuestra gráfica')+'</div></section>'+footer();}
  function select(label,key,values,c){return '<label class="gc-field"><span>'+label+'</span><select data-config="'+key+'">'+values.map(v=>'<option '+(c[key]===v?'selected':'')+'>'+esc(v)+'</option>').join('')+'</select></label>';}
  function field(label,key,min,max,c){return '<label class="gc-field"><span>'+label+'</span><input type="number" min="'+min+'" max="'+max+'" step="1" data-config="'+key+'" value="'+esc(c[key])+'"><small>'+min+' a '+max+(key==='qty'?' unidades':' cm')+'</small></label>';}
  function options(c){return c.kind==='cards'?'<span style="display:block;font-size:12px;margin-bottom:8px">Cantidad</span><div class="gc-choices">'+[250,500,1000].map(n=>'<button type="button" class="gc-choice" data-act="quantity" data-value="'+n+'" aria-pressed="'+(c.qty===n)+'">'+n+' unidades</button>').join('')+'</div><div class="gc-fields">'+select('Formato','format',['9 × 5 cm','8,5 × 5,5 cm'],c)+select('Papel ilustración','weight',['300 g','350 g'],c)+select('Impresión a color','sides',['Simple faz','Doble faz'],c)+select('Laminado','finish',['Sin laminado','Mate'],c)+'</div>':'<div class="gc-fields">'+field('Ancho · cm','width',20,150,c)+field('Alto · cm','height',20,500,c)+field('Cantidad','qty',1,20,c)+select('Ojales','eyelets',['Perimetrales','Sin ojales'],c)+'</div><p class="gc-note">Lona frontlit 440 g · Color · Medidas finales de la pieza.</p>';}
  function upload(c){return '<div class="gc-upload">'+ic(c.file?'file-check-2':'upload')+'<div style="min-width:0"><strong>'+(c.file?esc(c.file):'Tu diseño, listo para imprimir')+'</strong><p>'+(c.file?'Archivo adjunto. Nuestro equipo revisará que esté listo para producir.':'Podés adjuntarlo ahora o en el carrito. Lo revisaremos antes de producir.')+'</p>'+btn(c.file?'Usar otro PDF de ejemplo':'Usar PDF de ejemplo','sample','','gc-small')+'<label style="display:block"><span class="gc-note" style="display:block">O elegir un PDF de tu equipo:</span><input type="file" accept="application/pdf,.pdf" data-file class="gc-file-input" aria-label="Elegir archivo PDF"></label></div></div><p class="gc-note">En esta muestra sólo se usa el nombre del archivo. El contenido no se envía.</p>';}
  function summaryProduct(){const c=S.config,err=invalid(c);return '<div class="gc-summary-top"><h3>Tu impresión</h3><small>'+title(c)+'</small></div><div class="gc-summary-body">'+line('Cantidad',esc(c.qty)+(Number(c.qty)===1?' unidad':' unidades'))+(c.kind==='cards'?line('Formato',esc(c.format))+line('Papel','Ilustración '+esc(c.weight))+line('Impresión','Color · '+esc(c.sides).toLowerCase())+line('Laminado',esc(c.finish)):line('Medidas',esc(c.width)+' × '+esc(c.height)+' cm')+line('Material','Frontlit 440 g')+line('Ojales',esc(c.eyelets)))+'<hr class="gc-rule"><div class="gc-total-line"><span>Total</span>'+(err?'<span>Revisá las medidas</span>':total(price(c)))+'</div><div class="gc-estimate">'+ic('calendar-days')+'<div>Listo para retirar en '+(c.kind==='cards'?'3 a 5':'2 a 4')+' días hábiles<small>Estimación de ejemplo desde la aprobación del archivo y del pago.</small></div></div>'+btn(ic(S.editing>=0?'check':'plus')+(S.editing>=0?'Guardar cambios':'Agregar al carrito'),'add',err?'disabled':'','gc-primary gc-full')+'<p class="gc-note" style="text-align:center">La configuración se conserva con tu pedido.</p></div>';}
  function product(){const c=S.config;return header()+'<main class="gc-pad"><div class="gc-crumb">'+link('Productos','home')+ic('chevron-right')+'<span>'+title(c)+'</span></div><div class="gc-layout"><div><span class="gc-eyebrow">'+(c.kind==='cards'?'PEQUEÑO FORMATO':'GRAN FORMATO')+'</span><h1>'+title(c)+'<span style="color:var(--g-accent)">.</span></h1><p class="gc-description">'+(c.kind==='cards'?'El detalle que hace que te recuerden. Elegí cómo presentar tu marca.':'Para que tu mensaje se vea. Definí el tamaño exacto que necesitás.')+'</p><div class="gc-preview" role="img" aria-label="Muestra del producto">'+art(c.kind)+'<small>Imagen ilustrativa</small></div><section class="gc-group"><div class="gc-group-head"><span class="gc-step">01</span><h3>Hacelo tuyo</h3></div>'+options(c)+'<div id="gc-config-error" class="gc-error" role="alert">'+esc(invalid(c))+'</div></section><section class="gc-group"><div class="gc-group-head"><span class="gc-step">02</span><h3>Agregá tu archivo</h3></div>'+upload(c)+'<div class="gc-error" role="alert">'+esc(S.error)+'</div></section><details><summary>¿Cómo preparo el archivo?</summary><p>'+(c.kind==='cards'?'Para esta muestra: PDF a tamaño final con 3 mm de sangrado y una página por cara.':'Para esta muestra: PDF a tamaño final, sin escalar y orientado como se va a colocar.')+' Las indicaciones finales se configurarán por producto.</p></details></div><aside class="gc-summary" id="gc-summary-product" aria-live="polite" aria-label="Resumen de configuración">'+summaryProduct()+'</aside></div></main>'+footer();}
  function row(c,i,readonly=false){return '<article class="gc-cart-row"><div class="gc-item-icon">'+ic(c.kind==='cards'?'contact-round':'rectangle-horizontal')+'</div><div style="min-width:0"><h3>'+title(c)+'</h3><p class="gc-item-detail">'+esc(info(c))+'</p>'+(readonly?'':'<div class="gc-item-actions">'+link(ic('sliders-horizontal')+'Editar','edit','data-index="'+i+'"')+link(ic('trash-2')+'Quitar','remove','data-index="'+i+'"')+'</div>')+'<div class="gc-file-line">'+ic(c.file?'file-text':'file-warning')+(c.file?esc(c.file):'Falta tu archivo')+(!c.file&&!readonly?link('Usar PDF de ejemplo','cart-file','data-index="'+i+'" style="text-decoration:underline"'):'')+'</div></div><div class="gc-item-price">'+cash(price(c))+'</div></article>';}
  function summaryCart(checkout=false){const n=sum(S.cart),missing=S.cart.some(c=>!c.file);return '<div class="gc-summary-top"><h3>Resumen del pedido</h3><small>'+S.cart.length+' '+(S.cart.length===1?'producto':'productos')+'</small></div><div class="gc-summary-body">'+line('Productos sin IVA',cash(Math.round(n/1.21)))+line('IVA de muestra · 21%',cash(n-Math.round(n/1.21)))+line('Retiro en la gráfica','Sin cargo')+'<hr class="gc-rule"><div class="gc-total-line"><span>Total</span>'+total(n)+'</div>'+(checkout?'<button type="button" data-act="confirm" class="gc-btn gc-primary gc-full">Confirmar pedido de prueba '+ic('arrow-right')+'</button><p class="gc-note">'+(S.payment==='card'?'Se simulará un pago aprobado.':'Quedará pendiente de pago.')+' No se realizará ningún cobro.</p>':btn('Continuar con mi pedido '+ic('arrow-right'),'checkout',missing?'disabled':'','gc-primary gc-full')+(missing?'<p class="gc-error">Adjuntá los archivos para continuar.</p>':'<p class="gc-note">Revisaremos tus archivos antes de producir.</p>'))+'</div>';}
  function cart(){return header()+'<main class="gc-pad"><div class="gc-crumb">'+link(ic('arrow-left')+'Seguir eligiendo','home')+'</div><h1>Tu próximo proyecto<span style="color:var(--g-accent)">.</span></h1><p class="gc-description">Revisá la configuración y los archivos de tu pedido.</p>'+(!S.cart.length?'<div class="gc-empty">'+ic('shopping-bag')+'<h3>Tu carrito está esperando una idea.</h3><p>Empezá con tarjetas o una lona a medida.</p>'+btn('Ver productos '+ic('arrow-right'),'home','','gc-primary')+'</div>':'<div class="gc-layout" style="margin-top:25px"><div>'+S.cart.map((c,i)=>row(c,i)).join('')+btn(ic('plus')+'Agregar otro producto','home')+'</div><aside class="gc-summary">'+summaryCart()+'</aside></div>')+'</main>'+footer();}
  function checkout(){return header()+'<main class="gc-pad"><div class="gc-crumb">'+link(ic('arrow-left')+'Volver al carrito','cart')+'</div><span class="gc-eyebrow">UN ÚLTIMO PASO</span><h1>Démosle forma<span style="color:var(--g-accent)">.</span></h1><div class="gc-layout" style="margin-top:25px"><form id="gc-checkout-form"><section class="gc-group" style="border-top:0;padding-top:0"><h3 style="margin-bottom:15px">Datos de contacto</h3><div class="gc-fields"><label class="gc-field"><span>Nombre</span><input value="María" readonly aria-label="Nombre de ejemplo"></label><label class="gc-field"><span>Apellido</span><input value="Rodríguez" readonly aria-label="Apellido de ejemplo"></label></div><label class="gc-field" style="margin-top:14px"><span>Correo electrónico</span><input value="maria@example.com" readonly type="email" aria-label="Correo de ejemplo"><small>Datos ficticios para recorrer el prototipo.</small></label></section><section class="gc-group"><h3>Entrega</h3><div class="gc-radio">'+ic('store')+'<div>Retiro en Gráfica Corporearte<small>Te avisaremos cuando esté listo. Sin cargo.</small></div></div><p class="gc-note">El plazo comienza al confirmar el pago y aprobar los archivos.</p></section><section class="gc-group"><h3>Medio de pago</h3><label class="gc-radio"><input type="radio" name="gc-payment" value="card" '+(S.payment==='card'?'checked':'')+'><div>Pago online<small>Pago aprobado simulado, sin ingresar una tarjeta.</small></div></label><label class="gc-radio"><input type="radio" name="gc-payment" value="transfer" '+(S.payment==='transfer'?'checked':'')+'><div>Transferencia<small>El equipo confirma el pago después de recibir el pedido.</small></div></label></section></form><aside class="gc-summary" id="gc-summary-checkout">'+summaryCart(true)+'</aside></div></main>'+footer();}
  function progress(label,detail,cls){return '<div class="'+cls+'">'+label+'<small>'+detail+'</small></div>';}
  function confirmation(){const o=S.orders[S.selected];if(!o)return home();const paid=o.payment==='paid',ready=o.items.every(c=>c.approved);return header()+'<main class="gc-pad"><div class="gc-confirm"><div class="gc-check">'+ic('check')+'</div><div><span class="gc-eyebrow">PEDIDO '+esc(o.id)+'</span><h1>'+(o.ot?'Tu pedido ya tiene OT.':'Tu idea ya está en marcha.')+'</h1><p class="gc-description">'+(o.ot?'El equipo lo aceptó y puede organizar su producción.':paid?'Recibimos tu pedido y el pago de prueba. Ahora revisaremos tus archivos.':'Recibimos tu pedido. La confirmación del pago es el próximo paso.')+'</p></div></div><div class="gc-progress">'+progress('Pedido recibido','Configuración guardada','gc-done')+progress(paid?'Pago confirmado':'Pago pendiente',paid?'Pago de prueba registrado':'Transferencia por verificar',paid?'gc-done':'gc-current')+progress(ready?'Archivos aprobados':'Archivos en revisión',ready?'Listos para producir':'Los revisa nuestro equipo',ready?'gc-done':paid?'gc-current':'')+progress(o.ot?'OT emitida':'Preparación',o.ot?esc(o.ot):'Después de aprobar el pedido',o.ot?'gc-current':'')+'</div><div class="gc-order"><h3>Esto vamos a hacer para vos</h3>'+o.items.map((c,i)=>row(c,i,true)).join('')+'<div class="gc-order-foot">'+badge(ic('store')+'Retiro en nuestra gráfica')+total(sum(o.items))+'</div></div><div class="gc-next"><div><h3>'+(o.ot?'Todo conectado con Grafo.':'Ahora, del otro lado del mostrador.')+'</h3><p>'+(o.ot?'La configuración, los archivos y el pago acompañan a la orden.':'Mirá cómo recibe y revisa este pedido el equipo de la gráfica.')+'</p></div>'+btn('Ver el pedido en Grafo '+ic('arrow-up-right'),'admin','','gc-dark')+'</div>'+link(ic('arrow-left')+'Volver a la tienda','home')+'</main>'+footer();}
  function sidebar(){return '<aside class="gc-sidebar"><div class="gc-grafo">grafoprint<b>.</b></div><div class="gc-company">Gráfica Corporearte</div><div class="gc-admin-nav">'+ic('layout-dashboard')+'Inicio</div><div class="gc-admin-nav">'+ic('clipboard-list')+'Órdenes de trabajo</div><div class="gc-admin-nav gc-active">'+ic('store')+'GrafoCommerce</div><div class="gc-admin-nav">'+ic('settings-2')+'Configuración</div></aside>';}
  function admin(){const o=S.orders[S.selected];if(!o)return '<div class="gc-admin">'+sidebar()+'<main class="gc-admin-main"><span class="gc-eyebrow">CANAL DE VENTA ONLINE</span><h1>GrafoCommerce.</h1><div class="gc-empty">'+ic('inbox')+'<h3>Todo empieza en tu tienda.</h3><p>Completá un pedido de prueba para verlo llegar a Grafo.</p>'+btn('Recorrer la tienda '+ic('arrow-right'),'home','','gc-primary')+'</div></main></div>';
    const paid=o.payment==='paid',ready=o.items.every(c=>c.approved);
    let picker=S.orders.length>1?'<label class="gc-field" style="margin-bottom:18px"><span>Pedido a revisar</span><select id="gc-order-picker">'+S.orders.map((x,i)=>'<option value="'+i+'" '+(i===S.selected?'selected':'')+'>'+esc(x.id)+' · '+cash(sum(x.items))+(x.ot?' · OT emitida':'')+'</option>').join('')+'</select></label>':'';
    return '<div class="gc-admin">'+sidebar()+'<main class="gc-admin-main"><div class="gc-admin-heading"><div><span class="gc-eyebrow">GRAFOCOMMERCE</span><h1>Pedidos web<span style="color:var(--g-accent)">.</span></h1><p>De la tienda a tu operación, con todo en su lugar.</p></div>'+btn('Vista del cliente '+ic('arrow-up-right'),'myorder','','gc-small')+'</div><div class="gc-admin-tabs">Recibidos · <strong>'+S.orders.length+'</strong></div>'+picker+'<article class="gc-order-box"><div class="gc-order-head"><div><h3>'+esc(o.id)+' · María Rodríguez</h3><small>Pedido de prueba · Retiro en local · '+o.items.length+' '+(o.items.length===1?'producto':'productos')+'</small></div><strong>'+cash(sum(o.items))+'</strong></div><div class="gc-order-body"><div class="gc-statuses">'+badge(ic(paid?'check':'clock-3')+(paid?'Pago confirmado':'Pago pendiente'),paid?'gc-success':'gc-warning')+badge(ic(ready?'file-check-2':'file-clock')+(ready?'Archivos aprobados':'Revisar archivos'),ready?'gc-success':'gc-warning')+badge(o.ot?'OT vinculada':'Sin OT todavía')+'</div>'+(!paid?btn('Registrar pago de prueba','pay','','gc-small'):'')+o.items.map((c,i)=>'<div class="gc-review"><div style="min-width:0"><h3>'+title(c)+'</h3><p>'+esc(info(c))+'</p><p>'+ic('file-text')+' '+esc(c.file)+'</p></div>'+(c.approved?badge('Archivo aprobado','gc-success'):btn(ic('check')+'Aprobar archivo','approve','data-index="'+i+'"','gc-small'))+'</div>').join('')+(o.ot?'':'<div class="gc-callout">'+ic('info')+'<span>'+(!paid?'Confirmá el pago y revisá los archivos para emitir la orden.':!ready?'El pago está registrado. Falta aprobar los archivos antes de emitir la OT.':'El pedido está listo. La OT conservará cada configuración, archivo y pago.')+'</span></div>')+'</div><div class="gc-admin-actions"><p>'+(o.ot?'Pedido aceptado. La producción se organiza desde la OT.':'La aceptación crea una sola OT con todos los ítems de este pedido.')+'</p>'+btn(ic(o.ot?'check':'arrow-right')+(o.ot?'OT emitida':'Aceptar y crear OT'),'emit',!paid||!ready||o.ot?'disabled':'','gc-primary')+'</div></article>'+(o.ot?'<div class="gc-ot"><h3>'+ic('clipboard-check')+' '+esc(o.ot)+' · Lista para planificar</h3><p>Origen '+esc(o.id)+' · '+o.items.length+' '+(o.items.length===1?'producto':'productos')+' · '+cash(sum(o.items))+' · Pago vinculado.</p><p>La emisión no inicia producción ni manda archivos a imprimir.</p></div>':'')+'<div class="gc-history">'+ic('history')+' '+(o.ot?'Pedido recibido → pago confirmado → archivos aprobados → OT emitida.':'El historial acompaña al pedido durante todo el recorrido.')+'</div></main></div>';
  }
  function icons(){if(typeof lucide!=='undefined')lucide.createIcons({attrs:{width:18,height:18}});}
  function applyDesign(){R.style.setProperty('--g-accent',D.accent);R.style.setProperty('--g-gap',D.spacing==='Compacta'?'20px':'28px');}
  function render(){applyDesign();const pages={home,product,cart,checkout,confirmation};V.innerHTML=S.mode==='admin'?admin():(pages[S.screen]||home)();R.querySelector('[data-act="store"]').setAttribute('aria-pressed',String(S.mode==='store'));R.querySelector('[data-act="admin"]').setAttribute('aria-pressed',String(S.mode==='admin'));R.querySelector('#gc-count').textContent=S.orders.length?'· '+S.orders.length:'';icons();}
  function go(screen){S.mode='store';S.screen=screen;S.error='';render();R.scrollIntoView({block:'start',behavior:'instant'});save();}
  function message(text){const el=R.querySelector('#gc-message');el.textContent=text;el.hidden=false;}
  function updateProduct(){const box=R.querySelector('#gc-summary-product');if(box)box.innerHTML=summaryProduct();const err=R.querySelector('#gc-config-error');if(err)err.textContent=invalid(S.config);icons();}
  R.addEventListener('click',e=>{
    const b=e.target.closest('button[data-act]');if(!b||b.disabled)return;
    R.querySelector('#gc-message').hidden=true;
    const a=b.dataset.act,i=Number(b.dataset.index),o=S.orders[S.selected];
    if(a==='store'||a==='home'){go('home');return;}
    if(a==='catalog'){go('home');R.querySelector('#gc-catalog')?.scrollIntoView({block:'start',behavior:'instant'});return;}
    if(a==='admin'){S.mode='admin';render();R.scrollIntoView({block:'start',behavior:'instant'});save();return;}
    if(a==='myorder'){go('confirmation');return;}
    if(a==='cart'){go('cart');return;}
    if(a==='confirm'){confirmOrder();return;}
    if(a==='product'){S.config=fresh(b.dataset.kind);S.editing=-1;go('product');return;}
    if(a==='quantity'){S.config.qty=Number(b.dataset.value);render();save();return;}
    if(a==='sample'){S.config.file=S.config.kind==='cards'?'tarjetas-botanica.pdf':'lona-festival.pdf';S.error='';render();save();return;}
    if(a==='add'){if(invalid(S.config))return;if(S.editing<0&&S.cart.length>=8){message('El prototipo permite hasta 8 productos por pedido.');return;}const c={...S.config,approved:false};if(S.editing>=0)S.cart[S.editing]=c;else S.cart.push(c);S.editing=-1;go('cart');return;}
    if(a==='edit'&&S.cart[i]){S.config={...S.cart[i]};S.editing=i;go('product');return;}
    if(a==='remove'){S.cart.splice(i,1);render();save();return;}
    if(a==='cart-file'&&S.cart[i]){S.cart[i].file=S.cart[i].kind==='cards'?'tarjetas-botanica.pdf':'lona-festival.pdf';render();save();return;}
    if(a==='checkout'&&S.cart.length&&S.cart.every(c=>c.file)){go('checkout');return;}
    if(a==='pay'&&o){o.payment='paid';render();save();message('Pago de prueba registrado.');return;}
    if(a==='approve'&&o?.items[i]){o.items[i].approved=true;render();save();return;}
    if(a==='emit'&&o&&!o.ot&&o.payment==='paid'&&o.items.every(c=>c.approved)){o.ot='OT-DEMO-'+String(o.sequence).padStart(3,'0');render();save();message('OT de prueba emitida. Podés volver a la vista del cliente.');}
  });
  R.addEventListener('input',e=>{const k=e.target.dataset.config;if(k&&['width','height','qty'].includes(k)){S.config[k]=e.target.value===''?'':Number(e.target.value);updateProduct();}});
  R.addEventListener('change',e=>{
    const k=e.target.dataset.config;if(k){S.config[k]=['width','height','qty'].includes(k)?Number(e.target.value):e.target.value;updateProduct();save();return;}
    if(e.target.matches('[data-file]')){const f=e.target.files?.[0];if(!f)return;if(!/\.pdf$/i.test(f.name))S.error='Elegí un archivo PDF para esta muestra.';else if(f.size>50*1024*1024)S.error='Elegí un PDF de hasta 50 MB para esta muestra.';else{S.config.file=f.name.slice(0,180);S.error='';}render();save();return;}
    if(e.target.name==='gc-payment'){S.payment=e.target.value;R.querySelector('#gc-summary-checkout').innerHTML=summaryCart(true);icons();save();return;}
    if(e.target.id==='gc-order-picker'){S.selected=Number(e.target.value);render();save();}
  });
  function confirmOrder(){if(!S.cart.length||S.cart.some(c=>!c.file||invalid(c)))return;const seq=Math.max(0,...S.orders.map(o=>o.sequence||0))+1;S.orders=[...S.orders,{sequence:seq,id:'WEB-DEMO-'+String(seq).padStart(3,'0'),items:S.cart.map(c=>({...c,approved:false})),payment:S.payment==='card'?'paid':'pending',ot:null}].slice(-3);S.selected=S.orders.length-1;S.cart=[];S.editing=-1;go('confirmation');}
  R.addEventListener('submit',e=>{if(e.target.id==='gc-checkout-form'){e.preventDefault();confirmOrder();}});
  restore(window.openai?.widgetState);render();
  window.addEventListener('openai:set_globals',e=>{if(e.detail?.globals?.widgetState){restore(e.detail.globals.widgetState);render();}});
  if(globalThis.Tweak){const t=new Tweak({container:R,onChange:()=>{applyDesign();save();}});t.addColorPicker(D,'accent',{label:'Acento de la tienda',reference:'--g-accent'});t.addSelect(D,'spacing',{label:'Espaciado',options:['Cómoda','Compacta'],reference:'--g-gap'});}
})();
</script>
